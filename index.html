<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-번에 타자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 친근한 강원 사투리 인사, 화면은 실제 출시 앱처럼 차분하고 또렷하게
   IDEA: 버스 정류장 시간표 + 지하철 노선도식 단선 타임라인
   PICTURE: 큰 시각이 왼쪽에 걸린 세로 노선 타임라인, 다음 버스 카운트다운
   COLOUR and TYPE: 소양강 물빛 파랑 바탕, 흰 종이, 버스 경고용 코랄 하나 / IBM Plex Sans KR
   LAYOUT: 휴대폰 폭 한 열, 넓은 화면에서는 가운데 정렬 */
:root{color-scheme:light dark;
--lake:light-dark(#0b5d8f,#0d4a70);--lake2:light-dark(#e3f0f8,#132a3a);
--bg:light-dark(#0b5d8f,#081621);--paper:light-dark(#ffffff,#0f1f2b);
--ink:light-dark(#10212d,#e8f0f5);--mute:light-dark(#566978,#9bb0bf);
--line:light-dark(#d8e3ea,#24394a);--coral:#ff5a3c;--coral2:light-dark(#fff0ec,#3a1d16);
--ok:light-dark(#0c7f6e,#4fd1b5);--ok2:light-dark(#e2f5f1,#123430);
--warn:light-dark(#b45c00,#ffb15c);--warn2:light-dark(#fff3e2,#3a2a14)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans KR",system-ui,sans-serif;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
.top{max-width:520px;margin:0 auto;padding:18px 20px 14px;color:#fff;display:flex;align-items:center;gap:10px}
.top b{font-size:19px;letter-spacing:-.01em}.top small{margin-left:auto;font-size:13px;opacity:.8}
.top button{background:none;border:0;color:#fff;padding:6px 8px 6px 0;min-height:44px;cursor:pointer;font-size:15px}
#app{max-width:520px;margin:0 auto;background:var(--paper);min-height:calc(100vh - 72px);border-radius:22px 22px 0 0;padding:24px 20px 140px;position:relative}
h1{word-break:keep-all;font-size:30px;line-height:1.15;margin:4px 0 6px;text-wrap:balance;letter-spacing:-.02em}
h2{font-size:20px;margin:26px 0 10px}
p.lead{word-break:keep-all;color:var(--mute);margin:0 0 20px}
.mode{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:18px;padding:16px;margin:0 0 12px;cursor:pointer}
.mode:hover,.mode:focus-visible{border-color:var(--lake)}
.mode b{display:block;font-size:22px}.mode span{color:var(--mute);font-size:15px}
.mode.hot{border-color:var(--coral);box-shadow:0 0 0 3px var(--coral2)}
.mode .tag{display:inline-block;background:var(--coral);color:#fff;font-size:13px;border-radius:99px;padding:1px 9px;margin-bottom:4px}
.mode svg{width:96px;height:80px}
.saved{border-top:1px solid var(--line);padding:12px 0;display:flex;gap:10px;align-items:center}
.saved div{flex:1}.saved small{color:var(--mute)}
label.f{display:block;margin:0 0 14px;font-weight:600;font-size:15px}
label.f input,label.f select{display:block;width:100%;margin-top:6px;font-size:16px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);min-height:48px}
.f .fl{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
.picked{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;background:var(--lake2);border-radius:12px;padding:10px 12px;margin-bottom:8px}.picked b{font-size:18px}.picked small{color:var(--mute);font-size:14px}
.search{display:block;width:100%;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);min-height:48px}
.opts[hidden]{display:none}.opts{border:1.5px solid var(--line);border-radius:12px;margin-top:6px;max-height:268px;overflow:auto}
.opt{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 12px;cursor:pointer;min-height:48px}.opt:last-child{border-bottom:0}
.opt b{display:block;font-size:16px;font-weight:600}.opt small{color:var(--mute);font-size:13px}.opt.on{background:var(--lake2)}.opt:hover{background:var(--lake2)}
div.f{margin:0 0 16px}
.perm{border:2px solid var(--lake);border-radius:18px;padding:16px;margin:0 0 14px}.perm b{font-size:18px}.perm p{margin:4px 0 6px;color:var(--mute);font-size:15px}.perm .btn{margin-top:4px}
.loc{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;background:var(--lake2);border-radius:16px;padding:12px 14px;margin:0 0 10px}
.loc b{font-size:16px}.loc small{display:block;color:var(--mute);font-size:13px}.loc p{margin:4px 0 0;font-size:15px}.loc p.note{font-size:13px;color:var(--mute)}
.pin{display:inline-block;width:16px;height:16px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--coral);margin:4px 0 0 3px;flex:none}
.locbtn{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 8px;min-height:48px}.locmsg{margin:0 0 10px}
.lwarn{background:var(--coral);color:#fff;border-radius:12px;padding:10px 12px;font-weight:700;margin:0 0 12px}.lwarn .mini{color:#fff;display:block;font-weight:600}
.rno{display:inline-block;background:var(--lake);color:#fff;border-radius:6px;padding:0 7px;font-size:14px;margin-right:2px;font-variant-numeric:tabular-nums}.rno.w{background:#fff;color:var(--lake)}
.drtbtn{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:6px}.drtbtn .btn{display:flex;align-items:center;justify-content:center;text-decoration:none;margin:0;min-height:48px;font-size:15px}
.card p.note{font-size:13px}.card.drt{border-color:var(--lake)}
.sunl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:15px;color:var(--mute);margin:-6px 0 14px}.sunl b{color:var(--ink);font-variant-numeric:tabular-nums;margin-right:8px}
.sr,.ss{display:inline-block;width:18px;height:9px;border-radius:18px 18px 0 0;background:#ff9a3c;border-bottom:2px solid var(--mute)}.ss{background:#e8553b}
.b-sun{background:light-dark(#fff1e0,#3a2614);color:light-dark(#b4501a,#ffb27a)}
.mini.w{color:#fff;display:block;font-weight:700}
.mic{flex:none;width:48px;min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);color:var(--lake);display:grid;place-items:center;cursor:pointer;padding:0}
.mic.on{background:var(--coral);border-color:var(--coral);color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--coral2)}}@media(prefers-reduced-motion:reduce){.mic.on{animation:none}}
.dock .hint{margin:4px 2px 0}.dock .textin{margin:6px 0 0}
.sunok{background:var(--ok2);color:var(--ok);border-radius:12px;padding:10px 12px;font-weight:600;margin:0 0 12px}
.tin{display:block;width:100%;font-size:16px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);min-height:48px}.tin:disabled{opacity:.45}
.undec{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mute);margin-top:8px;min-height:32px;cursor:pointer}.undec input{width:20px;height:20px;accent-color:var(--lake)}
.stops{display:grid;gap:2px;margin:4px 0 2px;font-size:14px;color:var(--ink)}.stops i{font-style:normal;display:inline-block;font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-right:6px}.stops i.on{color:var(--lake);border-color:var(--lake)}
.live{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin:0 0 10px}.lvh{margin:0 0 6px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.lvdot{width:8px;height:8px;border-radius:50%;background:#18b36b;box-shadow:0 0 0 3px rgba(24,179,107,.2)}.lvl{list-style:none;margin:0;padding:0;display:grid;gap:4px}.lvl li{display:flex;align-items:center;gap:8px;font-size:15px}.lvl li span:last-child{color:var(--mute);font-size:13px;margin-left:auto}
.lvwait,.lverr{margin:0;font-size:13px;color:var(--mute)}.lverr{color:var(--coral)}
.guide{border:2px solid var(--lake);border-radius:18px;padding:14px;margin:0 0 12px}
.gh .gk{display:inline-block;background:var(--lake);color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:1px 9px;margin-bottom:4px}
.gh b{display:block;font-size:19px;line-height:1.3}.gh p{margin:2px 0 8px;color:var(--mute);font-size:15px}
.gdir{display:flex;align-items:center;gap:12px;background:var(--coral2);border-radius:14px;padding:10px 12px;margin:0 0 10px}.gdir b{font-size:18px}.gdir p{margin:0;font-size:14px;color:var(--ink)}
.garr{flex:none;width:44px;height:44px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:700;line-height:1}
.gnow{background:var(--ok2);color:var(--ok);font-weight:700;border-radius:12px;padding:10px 12px;margin:0 0 10px}.gnote{font-size:14px;color:var(--mute);margin:0 0 10px}
.gsvg{display:block;width:100%;height:auto}.kmap.g{height:220px}.gfoot{font-size:12px;color:var(--mute);margin:6px 0 0}
.kstop{background:#0b5d8f;color:#fff;font:700 12px/1 'IBM Plex Sans KR',sans-serif;padding:6px 9px;border-radius:8px;white-space:nowrap;margin-bottom:6px}
.edcmd{border:2px solid var(--lake);border-radius:16px;padding:14px;margin:0 0 16px}.edcmd>b{font-size:17px}.edcmd>p{margin:4px 0 6px;font-size:14px;color:var(--mute)}
.edlog{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px}.edlog li{font-size:14px;background:var(--ok2);color:var(--ok);border-radius:8px;padding:6px 10px;font-weight:600}.edlog li.bad{background:var(--coral2);color:var(--coral)}
.edopts{display:flex;gap:14px;margin-top:6px}
.edbtn{margin:0 0 14px}.edbar{border:2px dashed var(--lake);border-radius:16px;padding:14px;margin:0 0 16px}.edbar b{font-size:17px}.edbar p{margin:4px 0 10px;font-size:14px;color:var(--mute)}.edbar p.alert{color:#fff}.edbar .btn{margin-top:0}
.ectl{display:grid;gap:6px;margin-top:8px}.erow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;color:var(--mute);font-weight:400}
.erow button{border:1px solid var(--line);background:var(--paper);border-radius:10px;min-height:38px;min-width:40px;padding:4px 10px;cursor:pointer;font-size:14px;color:var(--ink)}.erow button:disabled{opacity:.35}.erow button.del{color:var(--coral);border-color:var(--coral)}
.erow b{font-size:15px;color:var(--ink);min-width:44px;text-align:center}.erow input{font-size:16px;padding:6px 8px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);min-height:38px}
.late{color:var(--coral);font-weight:700}
.b-me{background:var(--lake2);color:var(--lake)}
.rmap{margin:0 0 18px}.kmap{width:100%;height:260px;border-radius:14px;overflow:hidden;background:var(--lake2)}
.kpin{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid #0b5d8f;color:#10212d;font:700 12px/18px 'IBM Plex Sans KR',sans-serif;text-align:center}.kpin.hub{border-radius:6px;background:#0b5d8f;color:#fff}
.kme{width:16px;height:16px;border-radius:50%;background:#ff5a3c;border:3px solid #fff;box-shadow:0 0 0 8px rgba(255,90,60,.2)}.rmap svg{display:block;width:100%;height:auto}.rmap figcaption{font-size:13px;color:var(--mute);margin-top:8px}
.mleg{list-style:none;margin:0 0 6px;padding:0;display:flex;flex-wrap:wrap;gap:4px 12px}.mleg li{font-size:14px;color:var(--ink)}.mleg b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--lake);color:#fff;font-size:11px;margin-right:4px}
.seg.dur{display:flex;width:100%}.seg.dur button{flex:1;padding:8px 6px}
.mode.lite{grid-template-columns:44px 1fr;padding:12px 16px}.mode.lite b{font-size:18px}.lic{width:36px;height:36px;border-radius:10px;background:var(--lake2);position:relative}.lic::after{content:"";position:absolute;left:11px;top:7px;width:14px;height:14px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--lake)}
.spot{border:1.5px solid var(--line);border-radius:18px;padding:16px;margin:0 0 14px}.sph{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.sph b{font-size:19px;margin-right:4px}.sph .badge{margin:0}
.spd{margin:8px 0;font-size:15.5px}.sph2{margin:0 0 8px;padding-left:18px;font-size:15px}.sph2 li{margin:2px 0}
.spm{margin:4px 0;font-size:15px;display:flex;gap:8px;align-items:baseline}.spm span:first-child{flex:none;font-size:13px;color:var(--mute);width:62px}
.sptip{background:var(--lake2);border-radius:10px;padding:8px 10px;font-size:14px;margin:8px 0}.sptags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}.sptags span{font-size:13px;color:var(--lake)}
.spq{margin:0 0 14px}.spq .hint{margin-top:6px}.spgo{margin-top:10px;min-height:46px;font-size:16px}.spf{margin:0 0 16px}
.plink{border:0;background:none;padding:0;font:inherit;color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;cursor:pointer;text-align:left}
.intro{display:block;margin:8px 0 2px;background:var(--lake2);border-radius:12px;color:var(--ink)}
.intro summary{cursor:pointer;list-style:none;padding:10px 12px;font-size:15px;font-weight:700;color:var(--lake);min-height:44px;display:flex;align-items:center;gap:6px}
.intro summary::-webkit-details-marker{display:none}.intro summary::before{content:"";border:6px solid transparent;border-left:8px solid var(--lake);border-right:0;transition:transform .15s}
.intro[open] summary::before{transform:rotate(90deg)}@media(prefers-reduced-motion:reduce){.intro summary::before{transition:none}}
ol.tl .intro li{display:list-item;padding:0;margin:2px 0}
.intro p{margin:0 12px 8px;font-size:15px;line-height:1.55}.intro ul{margin:0 12px 8px;padding-left:18px;font-size:14.5px}.intro li{margin:2px 0}
.intro .itip{font-size:14px;color:var(--mute);border-top:1px solid var(--line);padding-top:8px;margin-bottom:0;padding-bottom:10px}
.seg{display:inline-flex;background:var(--lake2);border-radius:14px;padding:4px;gap:4px;margin:0 0 16px}
.seg button{border:0;background:none;border-radius:10px;padding:8px 22px;min-height:42px;font-size:16px;font-weight:600;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--lake);color:#fff}
.regions{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;color:var(--mute);margin:-8px 0 18px}.regions button{border:1.5px solid var(--line);background:var(--lake2);color:var(--ink);border-radius:99px;padding:4px 16px;min-height:40px;font-size:15px;font-weight:600;cursor:pointer}.regions button.on{background:var(--lake);border-color:var(--lake);color:#fff}.regions button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.btn{display:block;width:100%;min-height:52px;border:0;border-radius:14px;background:var(--lake);color:#fff;font-weight:700;font-size:17px;cursor:pointer;margin-top:10px}
.btn.ghost{background:var(--lake2);color:var(--ink)}.btn.coral{background:var(--coral)}
.btn:focus-visible,.chip:focus-visible,.mode:focus-visible,input:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.grp{margin:0 0 16px}.grp h3{font-size:14px;color:var(--mute);margin:0 0 8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:99px;padding:8px 14px;min-height:40px;cursor:pointer;font-size:15px}
.chip.on{background:var(--lake);border-color:var(--lake);color:#fff}
.textin{display:flex;gap:8px;margin:6px 0 4px}
.textin input{flex:1;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--paper);min-height:48px}
.textin button{border:0;background:var(--lake);color:#fff;border-radius:14px;padding:0 16px;font-weight:700;cursor:pointer;min-width:64px}
.hint{font-size:14px;color:var(--mute);margin:6px 0 0}
.tabs{display:flex;gap:6px;margin:0 0 14px;overflow-x:auto}
.tabs button{flex:1;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 8px;cursor:pointer;min-height:48px;font-size:15px;white-space:nowrap}
.tabs button.on{border-color:var(--lake);background:var(--lake2);font-weight:700}
.sum{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:15px;color:var(--mute);margin:0 0 6px}.sum b{color:var(--ink)}
.why{font-size:14px;background:var(--lake2);border-radius:12px;padding:10px 12px;margin:0 0 14px}
ol.tl{list-style:none;margin:0;padding:0;position:relative}
ol.tl li{display:grid;grid-template-columns:62px 22px 1fr;gap:0 8px;position:relative;padding:0 0 14px}
ol.tl li .t{font-size:18px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.3}
ol.tl li .dot{position:relative}
ol.tl li .dot::before{content:"";position:absolute;left:10px;top:0;bottom:-14px;width:2px;background:var(--line)}
ol.tl li:last-child .dot::before{display:none}
ol.tl li .dot i{position:absolute;left:4px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--paper);border:3px solid var(--lake)}
ol.tl li.bus .dot i{border-radius:4px;background:var(--lake)}
ol.tl li.walk .dot i{width:10px;height:10px;left:6px;top:7px;border-width:2px;border-color:var(--mute)}
ol.tl li .c{font-size:15px;color:var(--mute);padding-bottom:2px}
ol.tl li .c b{display:block;color:var(--ink);font-size:17px}
ol.tl li.stay .c b{font-size:19px}
ol.tl li.done{opacity:.45}
ol.tl li.now .dot i{border-color:var(--coral);box-shadow:0 0 0 5px var(--coral2)}
ol.tl li.now .c b::after{content:" · 지금";color:var(--coral);font-size:14px}
.badge{display:inline-block;font-size:13px;border-radius:99px;padding:1px 9px;margin:4px 6px 0 0;white-space:nowrap}
.b-ok{background:var(--ok2);color:var(--ok)}.b-warn{background:var(--warn2);color:var(--warn)}.b-bad{background:var(--coral2);color:var(--coral)}
.extra{display:block;font-size:14px;color:var(--ink);margin-top:3px}
.mini{border:0;background:none;color:var(--mute);text-decoration:underline;cursor:pointer;font-size:14px;padding:6px 0;min-height:32px}
.status{background:var(--lake);color:#fff;border-radius:20px;padding:18px;margin:0 0 14px}
.status .where{font-size:15px;opacity:.9}
.status .big{display:flex;align-items:baseline;gap:8px;margin:6px 0 2px}
.status .big strong{font-size:clamp(44px,13vw,60px);line-height:1;font-variant-numeric:tabular-nums}
.status .big span{font-size:17px}
.status .sub{font-size:15px;opacity:.9}
.alert{background:var(--coral);color:#fff;border-radius:12px;padding:10px 12px;font-weight:700;margin:10px 0 0}
.demo{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:var(--mute);border:1.5px dashed var(--line);border-radius:14px;padding:10px;margin:0 0 18px}
.demo b{color:var(--ink);font-variant-numeric:tabular-nums}
.demo button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:6px 10px;cursor:pointer;min-height:38px;font-size:14px}
.demo .x{border-color:var(--coral);color:var(--coral)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5}
.dock>div{max-width:520px;margin:0 auto;background:var(--paper);border-top:1px solid var(--line);padding:10px 14px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.dock .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.dock .chip{flex:none;padding:6px 12px;min-height:36px;font-size:14px}

function spotScore(p,q){const qs=q.replace(/\s/g,''),nm=p.name.replace(/\s|·/g,''),it=INTRO[p.id]||{d:'',h:[],tip:''},txt=[it.d,...it.h,it.tip].join(' ');let s=0;
 if(nm.includes(qs)||(p.re&&p.re.test(q)))s+=10;if(/^[ㄱ-ㅎ]+$/.test(qs)&&cho(nm).includes(qs))s+=8;
 DICT.forEach(([re,tg])=>{if(re.test(' '+q+' ')&&p.tags.includes(tg))s+=4});p.tags.forEach(tg=>{if(q.includes(tg))s+=4});
 q.split(/\s+/).filter(w=>w.length>=2).forEach(w=>{if(txt.includes(w))s+=1});return s}
function spotList(){const f=S.spotTag||'',q=(S.spotQ||'').trim();let list=P.filter(p=>!f||p.tags.includes(f));
 if(q){list=list.map(p=>({p,s:spotScore(p,q)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.p)}
 if(!list.length){const other=regionOf(q),o=other&&other!==REGION.id?REG[other].name:null;
  return`<div class="empty">${q?`'${esc(q)}'에 맞는 곳을 찾지 못했어요.`:'이 키워드에 맞는 곳이 없어요.'}${o?`<br>${esc(o)} 지역 장소 같아요. <button class="mini" data-act="region" data-r="${other}">${esc(o)}에서 찾기</button>`:'<br>다른 말로 써 보거나 위의 키워드를 바꿔 보세요.'}</div>`}
 return(q?`<p class="hint" style="margin:0 0 10px">'${esc(q)}'에 맞는 곳 ${list.length}곳</p>`:'')+list.map(p=>spotCard(p,REGION,true)).join('')}
const spotOf=id=>{for(const r of Object.values(REG)){const p=r.places.find(x=>x.id===id);if(p)return{p,r}}return null};
function howTo(p,r){return p.remote?`${r.hub.name}에서 <span class="rno">${p.remote.no}번</span> 버스 ${p.remote.ride}분`:`${r.hub.name}에서 도보·시내버스 ${p.walk}분`}

 return`<article class="spot"><div class="sph"><b>${esc(p.name)}</b>${viewSpot(p)?'<span class="badge b-sun">노을·전망 명소</span>':''}${p.indoor?'<span class="badge b-me">실내</span>':''}</div>

 spots(){const f=S.spotTag||'';const tags=[...new Set(P.flatMap(p=>p.tags))];

 pre1(){const f=S.form;return`${regionSeg()}<h1>언제, 어디서 출발하세요?</h1><p class="lead">출발한 곳으로 귀가 시각까지 꼭 돌아오게 짜 드려요.</p>

 pre3(){if(S.multi)return pre3multi();S.viewDate=null;const p=S.plans[S.tab],dl=tm(S.form.deadline);

   const miss=(S.must||[]).filter(i=>!p.seq.includes(i)&&!(p.sunrise&&p.sunrise.id===i));

 trip(){const T=S.trip,now=T.now,st=T.steps,dl=T.deadline;

function planB(reason){const T=S.trip;acts=[];const b=T.steps.find(s=>s.k==='bus'&&s.arr>T.now&&s.dep>=T.now-30);
